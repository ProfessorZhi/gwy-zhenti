name: Cloud quality review
on:
  push:
    branches: [main, docs/progress-20261011]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 0
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Verify outer repair receipts and run unchanged historical safeguards
        run: python tools/full_repair_receipts_20261015.py --historical --tests
      - name: Test current answer and preservation safeguards
        working-directory: tools
        run: |
          python -m unittest full_repair_current_test full_repair_precise_answer_test_20261015 test_verify_index_image_pixels_20261015 -v
          python full_repair_current_audit_20261015.py
      - name: Read-only corpus and inventory verification
        run: python tools/cloud_quality.py --check
      - name: Decode every referenced frame from exact delivered Git blobs
        run: python tools/verify_index_image_pixels_20261015.py
