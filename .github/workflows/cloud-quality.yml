name: Cloud quality review
on:
  push:
    branches: [main, docs/progress-20261011]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test existing pipeline and exact-source safeguards
        working-directory: tools
        run: |
          python -m unittest discover -s tests -q
          python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test -v
      - name: Install pinned image validator
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Read-only corpus and inventory verification
        run: python tools/cloud_quality.py --check --verify-images
      - name: Verify reviewed paper and image receipt chains
        run: python tools/verify_repair_receipts.py
      - name: Decode actual pixels of every referenced image
        run: python tools/verify_image_pixels.py
