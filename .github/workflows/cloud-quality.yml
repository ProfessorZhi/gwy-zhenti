name: Cloud quality review
on:
  push:
    branches: [main, docs/progress-20261011]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      time_pinned_audit:
        description: >-
          Run verify_repair_receipts.py (time-pinned: asserts the exact 2026-10-13 corpus,
          so it only passes at commit efbc2daa5, not on today's tree). Leave off for a
          normal manual run; turn on only when deliberately auditing that receipt chain.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloud-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Test existing pipeline and exact-source safeguards
        working-directory: tools
        run: |
          python -m unittest discover -s tests -q
          python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test round3_repair_test -v
      - name: Read-only corpus and inventory verification
        run: python tools/cloud_quality.py --check --verify-images
      # Time-pinned audit: verify_repair_receipts.py asserts the exact corpus of the
      # 2026-10-13 deliveries (729 papers / 451 missing answers). The corpus has since
      # grown to 1291 papers, so it can only pass at its own commit (efbc2daa5). It is
      # therefore opt-in via the workflow_dispatch input, and can also be run by hand:
      #   git worktree add <tmp> efbc2daa5 && (cd <tmp> && python tools/verify_repair_receipts.py)
      - name: Verify reviewed paper and image receipt chains (time-pinned, opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.time_pinned_audit
        run: python tools/verify_repair_receipts.py
      - name: Decode actual pixels of every referenced image
        run: python tools/verify_image_pixels.py
