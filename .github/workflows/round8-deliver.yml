name: Round8 verified 7 essay answers on R7 full-corpus baseline
on:
  push:
    branches: [feat/essay-r8-original-examples-20261013]
    paths: ['.github/workflows/round8-deliver.yml']
permissions:
  contents: write
concurrency:
  group: round8-essay-writing
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'ProfessorZhi/gwy-zhenti'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Apply only missing seven independently authored answers
        run: |
          python -m py_compile tools/round8_reference_delivery.py tools/verify_round8_reference.py tools/round8_corpus_report.py
          python tools/round8_reference_delivery.py --apply
      - name: Refresh GitHub corpus manifest and quality
        run: python tools/cloud_quality.py --build --verify-images
      - name: Count all 738 papers with existing R7 guide preserved
        run: python tools/round8_corpus_report.py
      - name: Validate all historical R1 through R8 receipts against original text
        run: |
          python tools/verify_round8_reference.py
          python tools/verify_repair_receipts.py
      - name: Run entire test suite and decode referenced image pixels
        run: |
          (cd tools && python -m unittest discover -s tests -q)
          (cd tools && python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test round3_repair_test -q)
          python tools/cloud_quality.py --check --verify-images
          python tools/verify_image_pixels.py
      - name: Remove temporary privilege-bearing workflows before delivery
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('round8-audit.yml','round8-deliver.yml'):
              path=Path('.github/workflows')/name
              assert path.is_file()
              path.unlink()
          PY
          python tools/verify_repair_receipts.py
      - name: Push only approved four Markdown papers and verifiable reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          branch='feat/essay-r8-original-examples-20261013'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert os.environ['GITHUB_REPOSITORY']=='ProfessorZhi/gwy-zhenti'
          rs=[json.loads(x) for x in Path('reports/ROUND8-ORIGINAL-ANSWERS-20261013.jsonl').read_text(encoding='utf-8').splitlines() if x]
          papers={r['path'] for r in rs}
          assert len(rs)==4 and len(papers)==4 and sum(len(r['added_answers']) for r in rs)==7
          allowed=papers|{
            'PROGRESS.md','README.md','QUALITY.md','COVERAGE-优先区.md',
            'catalog/manifest.jsonl','reports/QUALITY-SUMMARY.json','reports/QUALITY-AUDIT.md',
            'reports/DEFECTS.jsonl','reports/PRIORITY-MISSING.json',
            'reports/PRIORITY-QUALITY-20261012.md',
            'reports/ROUND8-ORIGINAL-ANSWERS-20261013.jsonl',
            'reports/REPAIR-SUMMARY-20261013-R8.json',
            'reports/QUALITY-REPAIR-20261013-R8.md',
            '.github/workflows/round8-audit.yml','.github/workflows/round8-deliver.yml'
          }
          def filenames(args):
              return {s for s in subprocess.check_output(['git',*args]).decode('utf-8').split('\0') if s}
          changed=filenames(['diff','--name-only','-z'])|filenames(['ls-files','--others','--exclude-standard','-z'])
          assert papers<=changed,'Not all four modified essays are present'
          assert {'reports/ROUND8-ORIGINAL-ANSWERS-20261013.jsonl','reports/QUALITY-REPAIR-20261013-R8.md','PROGRESS.md'}<=changed
          assert changed<=allowed,'Refuse unexpected changes '+str(changed-allowed)
          assert not any(p.startswith('图片/') or p.startswith('tools/data/') for p in changed)
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]',
              '-c','user.email=41898282+github-actions[bot]@users.noreply.github.com',
              'commit','-m','feat: 第八轮补7份完整同题示范作答，承接738份申论R7验收链'],check=True)
          helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f'
          git=['git','-c','credential.helper='+helper]
          actual=subprocess.check_output(git+['ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert actual==os.environ['GITHUB_SHA'],'Concurrent branch update; refuse forced overwrite'
          subprocess.run(git+['push','origin','HEAD:refs/heads/'+branch],check=True)
          print('ROUND8_DELIVERED_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('ROUND8_COMPLETED_STUDY_REFERENCES=7; TOTAL_ESSAY_CORPUS=738')
          PY
