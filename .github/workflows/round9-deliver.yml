name: Round9 verified eleven answers (isolated R8 baseline)
on:
  push:
    branches: [feat/essay-r9-more-complete-20261013]
    paths: ['.github/workflows/round9-deliver.yml']
permissions:
  contents: write
concurrency:
  group: r9-complete-essay-answer-writing
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'ProfessorZhi/gwy-zhenti'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - name: Pinned quality dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Write exactly eleven separately checked answer texts into three existing exam MD files
        run: |
          python -m py_compile tools/round9_reference_delivery.py tools/verify_round9_reference.py tools/round9_corpus_report.py
          python tools/round9_reference_delivery.py --apply
      - name: Rebuild full corpus manifest and linked references
        run: python tools/cloud_quality.py --build --verify-images
      - name: Report genuine reference-answer coverage, not just R7 reading guides
        run: python tools/round9_corpus_report.py
      - name: Validate all R1-R9 historical receipt chains and original source preservation
        run: |
          python tools/verify_round9_reference.py
          python tools/verify_repair_receipts.py
      - name: Full tests, corpus manifest and all referenced image pixels
        run: |
          (cd tools && python -m unittest discover -s tests -q)
          (cd tools && python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test round3_repair_test -q)
          python tools/cloud_quality.py --check --verify-images
          python tools/verify_image_pixels.py
      - name: Remove temporary write-enabled workflows before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('round9-audit.yml','round9-deliver.yml'):
              path=Path('.github/workflows')/name
              assert path.is_file()
              path.unlink()
          PY
          python tools/verify_repair_receipts.py
      - name: Push only approved three exam MD and audited summaries, guarded against branch changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          branch='feat/essay-r9-more-complete-20261013'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert os.environ['GITHUB_REPOSITORY']=='ProfessorZhi/gwy-zhenti'
          records=[json.loads(x) for x in Path('reports/ROUND9-ORIGINAL-ANSWERS-20261013.jsonl').read_text(encoding='utf-8').splitlines() if x]
          papers={r['path'] for r in records}
          assert len(records)==3 and len(papers)==3 and sum(len(r['added_answers']) for r in records)==11
          allowed=papers|{
            'PROGRESS.md','README.md','QUALITY.md','COVERAGE-优先区.md',
            'catalog/manifest.jsonl','reports/QUALITY-SUMMARY.json','reports/QUALITY-AUDIT.md',
            'reports/DEFECTS.jsonl','reports/PRIORITY-MISSING.json',
            'reports/PRIORITY-QUALITY-20261012.md',
            'reports/ROUND9-ORIGINAL-ANSWERS-20261013.jsonl',
            'reports/REPAIR-SUMMARY-20261013-R9.json',
            'reports/QUALITY-REPAIR-20261013-R9.md',
            '.github/workflows/round9-audit.yml','.github/workflows/round9-deliver.yml'
          }
          def names(args):
              return {s for s in subprocess.check_output(['git',*args]).decode('utf-8').split('\0') if s}
          changed=names(['diff','--name-only','-z'])|names(['ls-files','--others','--exclude-standard','-z'])
          assert papers<=changed,'Not all three modified papers are present'
          assert {'reports/ROUND9-ORIGINAL-ANSWERS-20261013.jsonl','reports/QUALITY-REPAIR-20261013-R9.md','PROGRESS.md'}<=changed
          assert changed<=allowed,'Disallowed file changes: '+str(changed-allowed)
          assert not any(p.startswith('图片/') or p.startswith('tools/data/') for p in changed)
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]',
              '-c','user.email=41898282+github-actions[bot]@users.noreply.github.com',
              'commit','-m','feat: 申论第九轮上海重庆安徽三卷补11题含3篇完整作文'],check=True)
          helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f'
          git=['git','-c','credential.helper='+helper]
          remote=subprocess.check_output(git+['ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert remote==os.environ['GITHUB_SHA'],'Concurrent branch modification; refuse overwrite'
          subprocess.run(git+['push','origin','HEAD:refs/heads/'+branch],check=True)
          print('ROUND9_DELIVERED_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('ROUND9_COMPLETED_STUDY_REFERENCES=11; LONG_ESSAYS=3')
          PY
