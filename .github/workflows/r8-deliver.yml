name: R8 verified essay answer delivery
on:
  push:
    branches: [fix/essay-priority-refs-r8-rebased-20261013]
    paths: ['.github/workflows/r8-deliver.yml']
permissions:
  contents: write
concurrency:
  group: gwy-r8-essay-once
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'ProfessorZhi/gwy-zhenti'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned quality validators
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Apply 7 independently authored clearly labelled examples to 4 MD
        run: |
          python -m py_compile tools/r8_priority_fill.py tools/r8_report.py tools/verify_round8_priority.py
          python tools/r8_priority_fill.py --apply
      - name: Rebuild corpus inventory and source/asset checks
        run: python tools/cloud_quality.py --build --verify-images
      - name: Generate actual article/corpus progress report
        run: python tools/r8_report.py
      - name: Verify exact published text, unchanged old answers, all R1-R8 receipts
        run: |
          python tools/verify_round8_priority.py
          python tools/verify_repair_receipts.py
      - name: Run all unit regressions and actual pixel decoding
        run: |
          (cd tools && python -m unittest discover -s tests -q)
          (cd tools && python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test round3_repair_test -q)
          python tools/cloud_quality.py --check --verify-images
          python tools/verify_image_pixels.py
      - name: Remove one-off write and preview workflows, verify receipt after cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ('.github/workflows/r8-deliver.yml','.github/workflows/r8-safe-preview.yml'):
            p=Path(path)
            assert p.is_file()
            p.unlink()
          PY
          python tools/verify_repair_receipts.py
      - name: Commit only reviewed MD and generated data with remote-head lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          branch='fix/essay-priority-refs-r8-rebased-20261013'
          assert os.environ['GITHUB_REPOSITORY']=='ProfessorZhi/gwy-zhenti'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          records=[json.loads(s) for s in Path('reports/ROUND8-PRIORITY-ESSAY-20261013.jsonl').read_text().splitlines() if s]
          assert len(records)==4 and sum(len(x['new_study_answers']) for x in records)==7
          files={r['path'] for r in records}
          allow=files|{
            'PROGRESS.md','README.md','QUALITY.md','COVERAGE-优先区.md','catalog/manifest.jsonl',
            'reports/QUALITY-SUMMARY.json','reports/QUALITY-AUDIT.md','reports/DEFECTS.jsonl',
            'reports/PRIORITY-MISSING.json','reports/PRIORITY-QUALITY-20261012.md',
            'reports/ROUND8-PRIORITY-ESSAY-20261013.jsonl','reports/QUALITY-REPAIR-20261013-R8.md',
            '.github/workflows/r8-deliver.yml','.github/workflows/r8-safe-preview.yml'
          }
          def lines(args):
            return {s for s in subprocess.check_output(['git',*args]).decode('utf-8').split('\0') if s}
          changes=lines(['diff','--name-only','-z'])|lines(['ls-files','--others','--exclude-standard','-z'])
          assert files<=changes,'Missing modified papers: '+str(files-changes)
          assert {'PROGRESS.md','reports/ROUND8-PRIORITY-ESSAY-20261013.jsonl','reports/QUALITY-REPAIR-20261013-R8.md'}<=changes
          assert changes<=allow,'Unapproved changed paths: '+str(changes-allow)
          assert all(not f.startswith('图片/') for f in changes)
          subprocess.run(['git','add','--',*sorted(changes)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com',
            'commit','-m','fix: 补录江苏浙江四卷七题示范作答并保留全部R1-R8凭据'],check=True)
          helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f'
          git=['git','-c','credential.helper='+helper]
          remote=subprocess.check_output(git+['ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert remote==os.environ['GITHUB_SHA'],'Other writer updated branch'
          subprocess.run(git+['push','origin','HEAD:refs/heads/'+branch],check=True)
          print('R8_DELIVERED='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
