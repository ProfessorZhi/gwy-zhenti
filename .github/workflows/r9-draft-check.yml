name: R9 authored text and MD preview 93
on:
  push:
    branches: [complete/essay-r9-all-20261013]
    paths: ['.github/workflows/r9-draft-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /.gitattributes
            /tools/
            /reports/
            /国考/
            /省考/
      - name: Strict per-answer draft checks
        run: python tools/r9_check_authored.py
      - name: Preview original Markdown writeback and body preservation
        run: python tools/r9_apply_authored.py
      - name: Read-only exact-question material-evidence reuse discovery
        run: python tools/r9_find_reuse.py
