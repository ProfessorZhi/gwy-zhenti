name: Priority corpus completion
on:
  push:
    branches: [fix/priority-completion-20261012]
    paths: ['.github/workflows/priority-completion.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download bounded exam source evidence only
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/priority-full-sources
        run: python tools/priority_sources_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: priority-full-source-evidence
          path: ${{ runner.temp }}/priority-full-sources/
          retention-days: 2
          if-no-files-found: error
