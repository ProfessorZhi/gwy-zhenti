name: Priority corpus completion
on:
  push:
    branches: [fix/priority-completion-20261012]
    paths: ['.github/workflows/priority-completion.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read bounded publisher pages, data only
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'confirmed-sources';out.mkdir()
          jobs=[('js2026-b-full.html','https://www.congzhenggk.com/bishiti/shenlun/4421.html'),('js2026-b-reference.html','https://www.yeyulingfeng.com/a/1134499.html'),('js2026-a-reference.html','https://www.yeyulingfeng.com/a/1110030.html'),('congzheng-directory.html','https://www.congzhenggk.com/bishiti/shenlun/'),('bj2025-index.html','https://www.jike.vip/shuati/category/100984/100990.html')]
          def get(j):
              name,url=j
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'gwy-zhenti-source-review/1.0'}),timeout=35) as f:b=f.read(5000001)
                  if len(b)>5000000:raise ValueError('oversized')
                  (out/name).write_bytes(b)
                  return {'file':name,'url':url,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
              except Exception as e:return {'file':name,'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:rows=list(ex.map(get,jobs))
          (out/'results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: confirmed-2026-source-evidence
          path: ${{ runner.temp }}/confirmed-sources/
          retention-days: 2
          if-no-files-found: error
