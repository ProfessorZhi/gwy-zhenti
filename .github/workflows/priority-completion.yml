name: Priority corpus completion
on:
  push:
    branches: [fix/priority-completion-20261012]
    paths: ['.github/workflows/priority-completion.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch fixed public PDF evidence and publisher candidate page
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,os,pathlib,re,urllib.request,urllib.parse
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'old-answer-evidence';out.mkdir()
          def get(url,limit=35000000):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'gwy-zhenti-evidence/1.0'}),timeout=35) as f:b=f.read(limit+1)
              if len(b)>limit:raise ValueError('oversized')
              return b
          repo='Yaoyuan-Zhang319/AdministrativeAptitudeTest';commit='1896de17764058dc1199d668edbf9f7e96cbc77a'
          tree=json.loads(get('https://api.github.com/repos/'+repo+'/git/trees/'+commit+'?recursive=1',10000000))
          if tree.get('truncated'):raise ValueError('tree incomplete')
          jobs=[]
          for x in tree['tree']:
              p=x['path'];b=p.rsplit('/',1)[-1]
              if x['type']!='blob' or not b.endswith('.pdf') or '申论' not in b:continue
              if not (('江苏' in p and '2016' in b) or ('浙江' in p and ('2016' in b or '2017' in b))):continue
              jobs.append((f'evidence-{len(jobs):02d}.pdf','https://raw.githubusercontent.com/'+repo+'/'+commit+'/'+urllib.parse.quote(p,safe='/'),p))
          jobs += [('js2026-xc-listing.html','https://sjds.net/796945.html','publisher listing'),('gz2017-double.html','https://www.eol.cn/gongwuyuan/difang/zhenti/201703/t20170327_1501555.shtml','double examination area listing')]
          def fetch(j):
              name,url,source=j
              try:
                  b=get(url)
                  if name.endswith('.pdf') and not b.startswith(b'%PDF'):raise ValueError('not PDF')
                  (out/name).write_bytes(b)
                  return {'file':name,'url':url,'source':source,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
              except Exception as e:return {'file':name,'url':url,'source':source,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:rows=list(ex.map(fetch,jobs))
          (out/'results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: old-answer-evidence
          path: ${{ runner.temp }}/old-answer-evidence/
          retention-days: 2
          if-no-files-found: error
