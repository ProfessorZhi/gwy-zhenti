name: Round8 independent essay references preflight
on:
  push:
    branches: [feat/essay-r8-original-examples-20261013]
    paths: ['tools/round8_reference_delivery.py', 'reports/ROUND8-ORIGINAL-ANSWER-DRAFTS-20261013.json', '.github/workflows/round8-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /reports/
            /国考/
            /省考/
      - name: Verify new examples cannot overwrite existing institutional answers
        run: |
          python -m py_compile tools/round8_reference_delivery.py tools/verify_round8_reference.py
          python tools/round8_reference_delivery.py
