name: R7 whole essay reference audit
on:
  push:
    branches: [fix/shenlun-all-r7-20261013]
    paths: ['tools/r7_reference_audit.py', '.github/workflows/r7-reference-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /国考/
            /省考/
            /reports/
      - name: Audit every essay and identify exact source requests
        run: python tools/r7_reference_audit.py
