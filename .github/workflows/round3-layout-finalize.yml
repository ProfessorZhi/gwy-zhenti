name: Round3 final layout correction
on:
  push:
    branches: [fix/priority-source-repair-r3-20261012]
    paths: [.github/workflows/round3-layout-finalize.yml]
permissions:
  contents: read
jobs:
  finalize:
    if: github.repository == 'ProfessorZhi/gwy-zhenti' && github.ref == 'refs/heads/fix/priority-source-repair-r3-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - name: Install validators
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Correct only reviewed answer layout and extend the receipt chain
        run: |
          python tools/round3_layout_followup.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/verify_round3_repairs.py');t=p.read_text()
          old="text=p.read_text(encoding='utf-8');d=split_paper(text)"
          new="text=restore_receipted_version(root,rel,p.read_text(encoding='utf-8'));d=split_paper(text)"
          assert t.count(old)==1
          t=t.replace(old,new).replace('from paper_integrity_repair import split_paper\n','from paper_integrity_repair import split_paper\nfrom round3_layout_followup import restore_receipted_version\n')
          p.write_text(t,encoding='utf-8')
          p=Path('tools/verify_repair_receipts.py');t=p.read_text();old="    'ROUND3-ESSAY-20261012.jsonl',\n"
          assert t.count(old)==1
          p.write_text(t.replace(old,old+"    'ROUND3-LAYOUT-FOLLOWUP-20261012.jsonl',\n"),encoding='utf-8')
          PY
      - name: Update manifest without erasing third-round progress
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('PROGRESS.md');old=p.read_text();marker='## 第三轮：当前申论补全与剩余（2026-10-12）'
          assert old.count(marker)==1
          tail=old.split(marker,1)[1]
          subprocess.run(['python','tools/cloud_quality.py','--build','--verify-images'],check=True)
          p.write_text(p.read_text().rstrip()+'\n\n'+marker+tail+'\n合并前复读追加：浙江2016A答案已按原题1/2/3排序，错嵌在第2题解析中的题干移出并完整留存于排版后续凭据。\n',encoding='utf-8')
          p=Path('reports/QUALITY-REPAIR-20261012-R3.md');t=p.read_text().replace('新增16项结构保护测试','新增16项结构保护测试及3项换行/题号边界回归')
          t+='\n## 合并前人工复读的排版修正\n\n浙江2016A原第1题答案映射为第2题后，解析内部仍夹入原来的题干，且答案块显示为2/1/3。已只移出该错误嵌入段，接回被打断的解析句，并按1/2/3展示答案。材料和题目正文完全不动；并非删掉真实答案文字。\n\n此前23卷验收中的98份原答案是在正文重整阶段逐块保持的。此次其中1份仅移出混入的题干；完整旧混排块与移出原文保存在 `ROUND3-LAYOUT-FOLLOWUP-20261012.jsonl`，验证器先验证本次纯排版差异，再逆向还原上个版本，继续核对原始第三轮凭据。原凭据没有重写。\n'
          p.write_text(t,encoding='utf-8')
          p=Path('reports/REPAIR-SUMMARY-20261012-R3.json');s=json.loads(p.read_text());s['layout_followup_papers']=1;s['layout_followup_note']='One old answer had a misplaced question removed to an immutable reversible receipt; answer wording and all question/material bodies preserved.'
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Full final verification
        run: |
          cd tools
          python -m unittest discover -s tests -q
          python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test round3_repair_test -v
          cd ..
          python tools/cloud_quality.py --check --verify-images
          python tools/verify_repair_receipts.py
          python tools/verify_image_pixels.py
      - name: Commit only the reviewed follow-up without concurrent overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,subprocess
          branch='fix/priority-source-repair-r3-20261012'
          allowed={'省考/浙江/2016/申论-A类.md','tools/verify_round3_repairs.py','tools/verify_repair_receipts.py','reports/ROUND3-LAYOUT-FOLLOWUP-20261012.jsonl','reports/QUALITY-REPAIR-20261012-R3.md','reports/REPAIR-SUMMARY-20261012-R3.json','catalog/manifest.jsonl','COVERAGE-优先区.md','PROGRESS.md','reports/QUALITY-SUMMARY.json','reports/QUALITY-AUDIT.md','reports/DEFECTS.jsonl','reports/PRIORITY-MISSING.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0'))|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0'));changed.discard('')
          assert changed<=allowed, changed-allowed
          assert {p for p in changed if p.startswith(('国考/','省考/'))}=={'省考/浙江/2016/申论-A类.md'}
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: 浙江2016A答案按原题排序，移出错嵌题干并保留完整可逆凭据'],check=True)
          helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f';git=['git','-c','credential.helper='+helper]
          assert subprocess.check_output(git+['ls-remote','origin','refs/heads/'+branch],text=True).split()[0]==os.environ['GITHUB_SHA']
          subprocess.run(git+['push','origin','HEAD:refs/heads/'+branch],check=True)
          print('LAYOUT_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
