name: Round9 three-paper eleven-answer preflight
on:
  push:
    branches: [feat/essay-r9-more-complete-20261013]
    paths:
      - 'tools/round9_reference_delivery.py'
      - 'reports/ROUND9-ORIGINAL-ANSWER-DRAFTS-20261013.json'
      - '.github/workflows/round9-audit.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /reports/
            /国考/
            /省考/
      - name: Validate same-question, unchanged original text and authorship
        run: |
          python -m py_compile tools/round9_reference_delivery.py tools/verify_round9_reference.py
          python tools/round9_reference_delivery.py
