name: Round7 verified essay examples and full-corpus inventory
on:
  push:
    branches: [feat/essay-all-738-reference-20261013]
    paths: ['.github/workflows/round7-deliver.yml']
permissions:
  contents: write
concurrency:
  group: round7-essay-delivery-only
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'ProfessorZhi/gwy-zhenti'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - name: Pinned tests dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Recheck and write only seven clearly labeled study answers
        run: |
          python -m py_compile tools/round7_reference_delivery.py tools/verify_round7_reference.py tools/round7_corpus_report.py
          python tools/round7_reference_delivery.py --apply
      - name: Refresh manifest and machine-quality summary
        run: python tools/cloud_quality.py --build --verify-images
      - name: Publish exact 738-file corpus-wide answer inventory
        run: python tools/round7_corpus_report.py
      - name: Independently verify new answers and complete R1-R7 historical receipt chain
        run: |
          python tools/verify_round7_reference.py
          python tools/verify_repair_receipts.py
      - name: Existing regression, manifest consistency and image pixel integrity
        run: |
          (cd tools && python -m unittest discover -s tests -q)
          (cd tools && python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test round3_repair_test -q)
          python tools/cloud_quality.py --check --verify-images
          python tools/verify_image_pixels.py
      - name: Drop privileged and temporary delivery workflows before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('round7-audit.yml','round7-deliver.yml'):
              file=Path('.github/workflows')/name
              assert file.is_file()
              file.unlink()
          PY
          python tools/verify_repair_receipts.py
      - name: Write back only validated four essay papers and reports with conflict guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          branch='feat/essay-all-738-reference-20261013'
          assert os.environ['GITHUB_REPOSITORY']=='ProfessorZhi/gwy-zhenti'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          rows=[json.loads(x) for x in Path('reports/ROUND7-ORIGINAL-ANSWERS-20261013.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==4 and sum(len(r['added_answers']) for r in rows)==7
          paper_paths={r['path'] for r in rows}
          assert len(paper_paths)==4
          allowed=paper_paths | {
              'PROGRESS.md','README.md','QUALITY.md','COVERAGE-优先区.md',
              'catalog/manifest.jsonl','reports/QUALITY-SUMMARY.json','reports/QUALITY-AUDIT.md',
              'reports/DEFECTS.jsonl','reports/PRIORITY-MISSING.json',
              'reports/PRIORITY-QUALITY-20261012.md',
              'reports/ROUND7-ORIGINAL-ANSWERS-20261013.jsonl',
              'reports/REPAIR-SUMMARY-20261013-R7.json',
              'reports/SHENLUN-COVERAGE-ALL-738-20261013.jsonl',
              'reports/SHENLUN-QUALITY-COVERAGE-20261013.md',
              '.github/workflows/round7-audit.yml','.github/workflows/round7-deliver.yml'
          }
          def paths(argv):
              return {x for x in subprocess.check_output(['git',*argv]).decode('utf-8').split('\0') if x}
          changed=paths(['diff','--name-only','-z'])|paths(['ls-files','--others','--exclude-standard','-z'])
          assert paper_paths<=changed,'Incomplete actual source document modifications'
          assert {
              'reports/SHENLUN-COVERAGE-ALL-738-20261013.jsonl',
              'reports/SHENLUN-QUALITY-COVERAGE-20261013.md',
              'reports/ROUND7-ORIGINAL-ANSWERS-20261013.jsonl','PROGRESS.md'}<=changed
          assert changed<=allowed,'Unapproved paths: '+str(changed-allowed)
          assert not any(x.startswith('图片/') for x in changed)
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com',
              'commit','-m','feat: 修复7处同题申论答案并建立全部738份逐卷质量台账'],check=True)
          helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f'
          git=['git','-c','credential.helper='+helper]
          actual=subprocess.check_output(git+['ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert actual==os.environ['GITHUB_SHA'],'Remote branch advanced; do not overwrite'
          subprocess.run(git+['push','origin','HEAD:refs/heads/'+branch],check=True)
          print('ROUND7_DELIVERED_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('ROUND7_STUDY_ANSWERS=7, R7_PAPERS=4, FULL_ESSAY_INVENTORY=738')
          PY
