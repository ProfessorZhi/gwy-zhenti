name: R8 rebase-safe priority essay preview
on:
  push:
    branches: [fix/essay-priority-refs-r8-rebased-20261013]
    paths: ['.github/workflows/r8-safe-preview.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /tools/
            /reports/
            /国考/
            /省考/
      - name: Verify R7-aware targets and text lengths without touching original files
        run: |
          python -m py_compile tools/r8_priority_fill.py tools/verify_round8_priority.py
          python tools/r8_priority_fill.py
