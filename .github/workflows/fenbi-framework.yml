name: Fenbi framework offline tests
on:
  pull_request:
    paths:
      - 'tools/fenbi/**'
      - '.github/workflows/fenbi-framework.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fenbi/**'
      - '.github/workflows/fenbi-framework.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: tools/fenbi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies without browser downloads
        working-directory: tools/fenbi
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test parsing, preservation, authentication guards, checkpoints and export
        working-directory: tools/fenbi
        run: node --test test/model.test.mjs test/browser.test.mjs test/pipeline.test.mjs test/dom.test.mjs test/align.test.mjs test/answerqa.test.mjs test/reorder.test.mjs test/mapping.test.mjs test/incremental-validator.test.mjs
