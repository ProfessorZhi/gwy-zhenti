name: Paper integrity repair
on:
  push:
    branches: [fix/paper-integrity-20261011]
    paths: ['.github/workflows/paper-integrity.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch two independently published reference PDFs only
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,os,pathlib,urllib.request,urllib.parse
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'paper-evidence-2';out.mkdir()
          url='https://upload.xingguanggongkao.com/pdf/'+urllib.parse.quote('2022年国家公务员录用考试《行测》真题（副省卷-考生回忆版）.pdf')+'?time=1706601118'
          jobs=[('gk2022-xg.pdf',url),('zj2020a-gwy.pdf','https://www.chinagwy.org/files/20211227170045_75892.pdf')]
          def get(j):
              name,url=j
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60) as f:b=f.read(25000001)
                  if len(b)>25000000 or not b.startswith(b'%PDF'):raise ValueError('invalid or oversized PDF')
                  (out/name).write_bytes(b)
                  return dict(file=name,url=url,bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
              except Exception as e:return dict(file=name,url=url,error=str(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:r=list(pool.map(get,jobs))
          (out/'sources.json').write_text(json.dumps(r,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-evidence-2
          path: ${{ runner.temp }}/paper-evidence-2/
          retention-days: 2
          if-no-files-found: error
