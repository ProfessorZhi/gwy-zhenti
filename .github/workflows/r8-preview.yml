name: R8 original exemplar safe preview
on:
  push:
    branches: [fix/shenlun-authored-exemplars-r8-20261013]
    paths: ['tools/r8_*','.github/workflows/r8-preview.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /国考/
            /省考/
            /reports/
      - name: Compile authored scripts and verify all drafts without writing
        run: |
          python -m py_compile tools/r8_authored_apply.py tools/r8_authored_report.py tools/verify_round8_repairs.py
          python tools/r8_authored_apply.py
