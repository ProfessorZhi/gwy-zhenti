name: R11 isolated original-writing pilot
on:
  push:
    branches: [essay/r11-complete-568]
    paths:
      - .github/workflows/r11-model-pilot.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r11-model-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            tools
            reports
          sparse-checkout-cone-mode: true
      - name: Verify fixed model weights and start loopback-only inference
        run: python tools/r11_model_boot.py
      - name: Write and check one short answer and one full essay
        run: python tools/r11_cloud_writer.py --ids 009-1,010-4 --label pilot
      - name: Preserve generated drafts or explicit failure state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/r11_push_outputs.py --label pilot-00
