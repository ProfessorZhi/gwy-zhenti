name: Round3 source verification
on:
  push:
    branches: [fix/priority-source-repair-r3-20261012]
    paths: [.github/workflows/round3-source-probe.yml]
permissions:
  contents: read
concurrency:
  group: round3-scoped-delivery
  cancel-in-progress: false
jobs:
  apply-verified-repair:
    if: github.repository == 'ProfessorZhi/gwy-zhenti' && github.ref == 'refs/heads/fix/priority-source-repair-r3-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned readers and validators
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 Pillow==11.3.0
      - name: Apply exact reviewed scope
        run: |
          python tools/round3_source_boundaries.py --apply
          python - <<'PY'
          import json
          from pathlib import Path
          rs=[json.loads(x) for x in Path('reports/ROUND3-ESSAY-20261012.jsonl').read_text().splitlines() if x]
          assert len(rs)==23, 'Expected exactly 23 reviewed papers'
          assert json.loads(Path('reports/ROUND3-SOURCE-EXCEPTIONS-20261012.json').read_text())==[], 'Source exception; refuse commit'
          assert sum(r['new_questions'] for r in rs)==3
          assert sum(len(r['added_answers']) for r in rs)==5
          PY
      - name: Regenerate current inventory and truthful report
        run: |
          python tools/cloud_quality.py --build --verify-images
          python tools/round3_delivery_report.py
      - name: Full regression and byte-preservation verification
        run: |
          cd tools
          python -m unittest discover -s tests -q
          python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test round3_repair_test -v
          cd ..
          python tools/cloud_quality.py --check --verify-images
          python tools/verify_repair_receipts.py
          python tools/verify_image_pixels.py
      - name: Commit only validated targets without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          branch='fix/priority-source-repair-r3-20261012'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert os.environ['GITHUB_REPOSITORY']=='ProfessorZhi/gwy-zhenti'
          rs=[json.loads(x) for x in Path('reports/ROUND3-ESSAY-20261012.jsonl').read_text().splitlines() if x]
          papers={r['path'] for r in rs}
          assert len(papers)==23
          allowed=papers|{'catalog/manifest.jsonl','COVERAGE-优先区.md','PROGRESS.md','README.md','QUALITY.md','reports/QUALITY-SUMMARY.json','reports/QUALITY-AUDIT.md','reports/DEFECTS.jsonl','reports/PRIORITY-MISSING.json','reports/ROUND3-ESSAY-20261012.jsonl','reports/ROUND3-SOURCE-EXCEPTIONS-20261012.json','reports/REPAIR-SUMMARY-20261012-R3.json','reports/QUALITY-REPAIR-20261012-R3.md','reports/PRIORITY-QUALITY-20261012.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0'))|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0'))
          changed.discard('')
          assert changed<=allowed, 'Unreviewed changed paths: '+str(changed-allowed)
          assert papers<=changed, 'Some expected MDs were not modified'
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: 恢复23份申论完整材料与作答结构，补3题和5份来源答案'],check=True)
          helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f'
          git=['git','-c','credential.helper='+helper]
          remote=subprocess.check_output(git+['ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert remote==os.environ['GITHUB_SHA'], 'Remote moved; refuse overwrite'
          subprocess.run(git+['push','origin','HEAD:refs/heads/'+branch],check=True)
          print('DELIVERED_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('DELIVERED_PAPER_COUNT='+str(len(papers)))
          PY
