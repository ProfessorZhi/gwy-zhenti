name: Shenlun source search and continuation
on:
  push:
    branches: [essay/source-search-all-20261013]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Search every actual source gap
        run: python tools/search_all_shenlun_20261013.py
