name: Round4 verified gap delivery
on:
  push:
    branches: [fix/full-gap-repair-r4-20261012]
    paths: [.github/workflows/round4-gap-probe.yml]
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned source readers and validators
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 Pillow==11.3.0
      - name: Test answer and layout protection before writing
        run: python -m unittest discover -s tools/tests -p 'test_round4*.py' -v
      - name: Apply exactly the prevalidated 29-paper 67-answer set
        run: |
          python tools/round4_delivery.py --apply
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('reports/REPAIR-SUMMARY-20261012-R4.json').read_text())
          assert (s['modified_papers'],s['answers_added'],s['joint_exam_answers'])==(29,67,2), 'Reviewed scope changed'
          assert s['rejected']==[]
          PY
          python tools/round4_source_notes.py
          python tools/verify_round4_repairs.py
      - name: Regenerate inventory and current honest progress
        run: |
          python tools/cloud_quality.py --build --verify-images
          python tools/round4_report.py
      - name: Full tests, historical receipt chains and actual image pixels
        run: |
          cd tools
          python -m unittest discover -s tests -q
          python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test round3_repair_test -q
          cd ..
          python tools/cloud_quality.py --check --verify-images
          python tools/verify_repair_receipts.py
          python tools/verify_image_pixels.py
      - name: Commit only verified paper and report paths without concurrent overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          branch='fix/full-gap-repair-r4-20261012'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          assert os.environ['GITHUB_REPOSITORY']=='ProfessorZhi/gwy-zhenti'
          records=[json.loads(x) for x in Path('reports/ROUND4-ANSWERS-20261012.jsonl').read_text().splitlines() if x]
          papers={r['path'] for r in records}
          assert 29<=len(papers)<=31
          assert all(p.startswith(('省考/','国考/','市考/')) and p.endswith('.md') for p in papers)
          assert sum(len(r['added_answers']) for r in records)==67
          allowed=papers|{'catalog/manifest.jsonl','COVERAGE-优先区.md','PROGRESS.md','README.md','QUALITY.md','reports/QUALITY-SUMMARY.json','reports/QUALITY-AUDIT.md','reports/DEFECTS.jsonl','reports/PRIORITY-MISSING.json','reports/PRIORITY-QUALITY-20261012.md','reports/ROUND4-ANSWERS-20261012.jsonl','reports/ROUND4-UNRESOLVED-ANSWERS-20261012.json','reports/ROUND4-EXTERNAL-SOURCES-20261012.json','reports/REPAIR-SUMMARY-20261012-R4.json','reports/QUALITY-REPAIR-20261012-R4.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0'))|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0'))
          changed.discard('')
          assert changed<=allowed,'Unexpected changed files: '+str(changed-allowed)
          assert papers<=changed,'Expected MD changes missing'
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: 补入67份同题参考答案并更新全库剩余缺项'],check=True)
          helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f'
          git=['git','-c','credential.helper='+helper]
          remote=subprocess.check_output(git+['ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert remote==os.environ['GITHUB_SHA'],'Remote branch moved; refuse overwrite'
          subprocess.run(git+['push','origin','HEAD:refs/heads/'+branch],check=True)
          print('DELIVERED_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('DELIVERED_PAPERS='+str(len(papers)))
          PY
