name: Round4 gap probe
on:
  push:
    branches: [fix/full-gap-repair-r4-20261012]
    paths: [tools/round4_gap_repair.py, tools/round4_delivery.py, tools/verify_round4_repairs.py, tools/tests/test_round4_answers.py, .github/workflows/round4-gap-probe.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Test source matching and reversible preservation
        run: python -m unittest discover -s tools/tests -p test_round4_answers.py -v
      - name: Dry-run same-question repairs without writing files
        run: python tools/round4_delivery.py
