name: Round4 gap probe
on:
  push:
    branches: [fix/full-gap-repair-r4-20261012]
    paths: [tools/round4_gap_repair.py, .github/workflows/round4-gap-probe.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          show-progress: false
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Audit every essay and prove internal answer mappings
        run: python tools/round4_gap_repair.py --inspect
      - name: Inspect only public source structure
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from bs4 import BeautifulSoup,UnicodeDammit
          from concurrent.futures import ThreadPoolExecutor
          import json
          urls=['https://iget100.com/sitemap.xml','https://iget100.com/gongkao/shengkao/zhejiang','https://www.gzu521.net/gwy/2016/04/72803.htm','https://www.gzu521.net/gwy/2016/04/72826.htm','https://sjds.net/595993.html']
          def inspect(url):
            try:
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r:b=r.read(4000000)
              s=BeautifulSoup(UnicodeDammit(b,is_html=True).unicode_markup,'html.parser')
              print('PUBLIC_SOURCE',json.dumps({'url':url,'title':s.title.get_text() if s.title else '', 'chars':len(b),'locs':[x.get_text() for x in s.find_all('loc')][:12],'answer_blocks':len(s.select('span.text-correct')),'sample':s.get_text('\n',strip=True)[-14000:] if 'gzu521' in url else s.get_text('\n',strip=True)[:2000]},ensure_ascii=False),flush=True)
            except Exception as e:print('PUBLIC_ERROR',url,type(e).__name__,str(e),flush=True)
          with ThreadPoolExecutor(max_workers=3) as ex:list(ex.map(inspect,urls))
          PY
