name: Round5 verified answer delivery
on:
  push:
    branches: [fix/verified-answer-gaps-r5-20261013]
    paths: [.github/workflows/round5-verified-delivery.yml]
permissions:
  contents: write
jobs:
  verified-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          show-progress: false
      - name: Install pinned image validator
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Audit candidates and apply only evidenced answers
        shell: bash
        run: |
          set -euo pipefail
          python tools/round5_bulk.py | sed -n '1,2p'
          python tools/round5_delivery.py
          python tools/round5_delivery.py --apply
          python tools/verify_round5_repairs.py
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('reports')
          report=json.loads((base/'REPAIR-SUMMARY-20261012-R5.json').read_text())
          assert report['modified_papers']==41 and report['answers_added']==102, report
          assert not report['rejected'] and report['recognized_missing_slots_before']==901,report
          assert sum(1 for line in (base/'ROUND5-ANSWERS-20261012.jsonl').open() if line.strip())==41
          print('EXPECTED_SCOPE_CONFIRMED',report['answers_added'],report['modified_papers'])
          PY
      - name: Rebuild existing corpus inventory and exact-source report
        run: |
          set -euo pipefail
          python tools/cloud_quality.py --build --verify-images
          python tools/round5_report.py
      - name: Test corpus, old and new SHA chains, and every referenced image
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/tests -q
          (cd tools && python -m unittest cloud_quality_test paper_integrity_repair_test priority_quality_test essay_transcript_restore_test round3_repair_test -q)
          python tools/cloud_quality.py --check --verify-images
          python tools/verify_repair_receipts.py
          python tools/verify_image_pixels.py
      - name: Commit exactly approved documents after all checks succeed
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/fix/verified-answer-gaps-r5-20261013'
          assert os.environ['GITHUB_REPOSITORY']=='ProfessorZhi/gwy-zhenti'
          rr=[json.loads(x) for x in Path('reports/ROUND5-ANSWERS-20261012.jsonl').read_text().splitlines() if x]
          papers={r['path'] for r in rr}
          assert len(rr)==len(papers)==41
          report=json.loads(Path('reports/REPAIR-SUMMARY-20261012-R5.json').read_text())
          assert report['status']=='verified' and report['answers_added']==102
          allowed=papers|{
           'catalog/manifest.jsonl','COVERAGE-优先区.md','PROGRESS.md','README.md','QUALITY.md',
           'reports/QUALITY-SUMMARY.json','reports/QUALITY-AUDIT.md','reports/DEFECTS.jsonl',
           'reports/PRIORITY-MISSING.json','reports/PRIORITY-QUALITY-20261012.md',
           'reports/ROUND5-ANSWERS-20261012.jsonl','reports/ROUND5-UNRESOLVED-20261012.json',
           'reports/REPAIR-SUMMARY-20261012-R5.json','reports/QUALITY-REPAIR-20261013-R5.md'}
          tracked=set(subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0'))-{''}
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0'))-{''}
          changed=tracked|untracked
          assert changed<=allowed,'Unknown/unreviewed changes: '+str(changed-allowed)
          assert papers<=changed,'Expected paper files were not modified'
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: 补入41份申论的102处可追溯同题参考答案'],check=True)
          print('R5_COMMITTED='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
          git push origin HEAD:refs/heads/fix/verified-answer-gaps-r5-20261013
